name: hourly-quiz

on:
  schedule:
    # every 5 minutes, offset from the :00 congestion peak
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "answers/**"
      - "state/**"
      - "STATUS.md"

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: hourly-quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Answer new quiz rounds
        run: python3 run.py --git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUIZBOT_ALLOW_RESET: "1"

      # After solving, so a failing test never blocks answering,
      # but still fails the run (GitHub then emails the repo owner).
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
